services:
  media-agent-claude:
    build: .
    container_name: media-agent-claude
    restart: unless-stopped
    ports:
      - "0.0.0.0:8089:8088"
    env_file:
      - .env.claude
    volumes:
      - ./config:/app/config
      - agent-state-claude:/state
    networks:
      - agent-mesh
      - default

networks:
  agent-mesh:
    external: true
    name: agent-lab_agent-mesh

volumes:
  agent-state-claude:
