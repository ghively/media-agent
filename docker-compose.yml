services:
  media-agent:
    build: .
    container_name: media-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - agent-state:/state
    networks:
      - agent-mesh
      - default

networks:
  agent-mesh:
    external: true
    name: agent-lab_agent-mesh

volumes:
  agent-state:
